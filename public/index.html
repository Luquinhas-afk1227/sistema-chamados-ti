<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Helpdesk TI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-wrapper">
    <div class="login-card">
      <div class="login-cabecalho">
        <span class="login-tag">Suporte Técnico • Acesso Restrito</span>
        <h1>Helpdesk TI</h1>
        <p>Entre com suas credenciais para acessar o painel de atendimento.</p>
      </div>

      <form id="form-login">
        <div class="campo">
          <label for="login-email">E-mail Corporativo</label>
          <input
            type="email"
            id="login-email"
            placeholder="seu.nome@helpdesk.com"
            required
          />
        </div>

        <div class="campo">
          <label for="login-senha">Senha</label>
          <input
            type="password"
            id="login-senha"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn-primario">Entrar no Sistema</button>
        <p id="mensagem-login" class="mensagem-feedback" aria-live="polite"></p>
      </form>

      <div class="demo-box">
        <p><strong>Acesso de Demonstração:</strong></p>
        <span>E-mail: <code>lucas@helpdesk.com</code> • Senha: <code>123456</code></span>
        <button type="button" id="btn-preencher-demo" class="btn-secundario">
          Preencher dados de acesso
        </button>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
